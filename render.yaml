# Render Blueprint for the API server and its Postgres database.
# The web app and mobile web app are hosted on Vercel.
databases:
  - name: apex-nexus-db
    plan: free
    databaseName: apex
    user: apex

services:
  - type: web
    name: apex-nexus-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    # Create/update database tables, then start in production mode.
    # NODE_ENV is set here rather than as an env var so the build still installs dev tools.
    startCommand: pnpm --filter @workspace/db run push && NODE_ENV=production pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: apex-nexus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
