<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#0A0918;color:#F3F0FF;font-family:system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
  img{width:72px;height:72px;border-radius:20px}
  h1{margin:6px 0 0;font-size:22px}
  p{margin:0;color:rgba(243,240,255,.7);max-width:280px;line-height:1.45}
  button{margin-top:10px;height:44px;padding:0 22px;border-radius:22px;border:0;background:#F5F5F7;color:#0A0A0C;font-weight:800;font-size:15px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Apex needs an internet connection. Check your Wi‑Fi or data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
