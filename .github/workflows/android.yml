name: Android app

# Builds the Apex Android app (artifacts/apex-android) and, on main, publishes it as the latest GitHub release.
# The download link https://github.com/4triple000/Apex-Nexus/releases/latest/download/apex.apk always points to the newest build.
#
# Signing: add the repository secret ANDROID_KEYSTORE (the base64 of the release keystore, alias "apex").
# Every release must be signed with that same key, or phones can't update the app and the site's
# /.well-known/assetlinks.json (which holds the key's fingerprint) won't match.

on:
  push:
    branches: ["**"]
    paths:
      - "artifacts/apex-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APEX_VERSION_CODE: ${{ github.run_number }}
      APEX_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Load signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/apex-release.jks"
            {
              echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex-release.jks"
              echo "APEX_KEYSTORE_PASSWORD=apex-android-release"
              echo "APEX_KEY_ALIAS=apex"
            } >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Add the ANDROID_KEYSTORE secret (Settings > Secrets and variables > Actions) before releasing the app."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE secret: building a test copy with a throwaway key (not released)."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: artifacts/apex-android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: cp artifacts/apex-android/app/build/outputs/apk/release/app-release.apk apex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apex-apk
          path: apex.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APEX_VERSION_NAME }}
          name: Apex for Android ${{ env.APEX_VERSION_NAME }}
          body: |
            Install: open https://apex-nexus-apex.vercel.app/install on your Android phone, or download apex.apk below and open it.
          files: apex.apk
          make_latest: true
